services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes

    command: gateway run

    restart: unless-stopped

    ports:
      # OpenAI Compatible API
      - "8642:8642"

      # Dashboard
      - "9119:9119"

    environment:
      PYTHONHTTPSVERIFY: "0"
      ##########################################################
      # Dashboard
      ##########################################################
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "127.0.0.1"
      HERMES_DASHBOARD_PORT: "9119"

      ##########################################################
      # Dashboard Authentication (choose one provider)
      ##########################################################

      # Basic Auth
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: change-me
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: change-this-too

      # OAuth (optional)
      # HERMES_DASHBOARD_OAUTH_CLIENT_ID: xxx

      # Self Hosted OIDC (optional)
      # HERMES_DASHBOARD_OIDC_ISSUER: https://keycloak.company.com/realms/main
      # HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes

      ##########################################################
      # OpenAI Compatible API
      ##########################################################
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "127.0.0.1"
      API_SERVER_PORT: "8642"

      # Generate:
      # openssl rand -hex 32
      API_SERVER_KEY: "replace-with-generated-secret"

      API_SERVER_CORS_ORIGINS: "*"

      ##########################################################
      # Runtime UID/GID
      ##########################################################
      PUID: "1000"
      PGID: "1000"

      ##########################################################
      # Optional
      ##########################################################
      TZ: Asia/Taipei

    volumes:
      ##########################################################
      # Hermes Data
      ##########################################################
      - .hermes:/opt/data

      ##########################################################
      # Optional Docker Control
      ##########################################################
      # enables agent to inspect/manage containers
      - /var/run/docker.sock:/var/run/docker.sock

    shm_size: "1gb"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 4G

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

    security_opt:
      - no-new-privileges:true

    networks:
      - hermes

  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

    networks:
      - hermes


networks:
  hermes:
    driver: bridge