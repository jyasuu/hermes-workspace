server {
    listen 80;

    location / {

        proxy_pass https://api.openai.com/;

        proxy_set_header Host api.openai.com;

        proxy_ssl_server_name on;
        proxy_ssl_name api.openai.com;

        proxy_ssl_verify off;

        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}